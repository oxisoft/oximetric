name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o /dev/null ./cmd/oximetric/

      - name: Unit tests
        run: go test -v -count=1 ./internal/...
