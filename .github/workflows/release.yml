name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o /dev/null ./cmd/oximetric/

      - name: Unit tests
        run: go test -v -count=1 ./internal/...

      - name: Integration tests (SQLite)
        run: docker compose -f tests/integration/docker-compose.sqlite.yml up --build --abort-on-container-exit --exit-code-from integration-test

      - name: Integration tests (PostgreSQL)
        run: docker compose -f tests/integration/docker-compose.postgres.yml up --build --abort-on-container-exit --exit-code-from integration-test

      - name: Test coverage
        run: |
          go test -coverprofile=coverage.raw -coverpkg=./internal/... -count=1 ./internal/...
          grep -v -e 'internal/storage/postgres.go' -e 'internal/geoip/updater.go' coverage.raw > coverage.out
          go tool cover -func=coverage.out

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
