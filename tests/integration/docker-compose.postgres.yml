services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oximetric_test
      POSTGRES_USER: oximetric
      POSTGRES_PASSWORD: oximetric
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oximetric -d oximetric_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  integration-test:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
    environment:
      OXIMETRIC_TEST_PG_DSN: "postgres://oximetric:oximetric@postgres:5432/oximetric_test?sslmode=disable"
    command: ["go", "test", "-v", "-count=1", "./tests/integration/", "-args", "-db=postgres"]
    depends_on:
      postgres:
        condition: service_healthy
