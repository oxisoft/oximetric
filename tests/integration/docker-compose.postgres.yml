services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oximetric_test
      POSTGRES_USER: oximetric
      POSTGRES_PASSWORD: oximetric
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oximetric"]
      interval: 2s
      timeout: 3s
      retries: 10

  integration-test:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
    command: [
      "go", "test", "-v", "-count=1",
      "-db=postgres",
      "-pg-dsn=postgres://oximetric:oximetric@postgres:5432/oximetric_test?sslmode=disable",
      "./tests/integration/"
    ]
    depends_on:
      postgres:
        condition: service_healthy
