<div class="card content-card p-3 mb-4">
  <h6 class="mb-3">Profile</h6>
  <table class="table table-borderless table-sm mb-0">
    <tr><td class="text-muted" style="width:150px">Username</td><td id="profileUsername"><strong>—</strong></td></tr>
    <tr><td class="text-muted">Email</td><td id="profileEmail">—</td></tr>
    <tr><td class="text-muted">Role</td><td id="profileRole">—</td></tr>
    <tr><td class="text-muted">2FA</td><td id="profileTOTP">—</td></tr>
    <tr><td class="text-muted">Member since</td><td id="profileCreated">—</td></tr>
  </table>
</div>

<div class="row g-3">
  <div class="col-md-6">
    <div class="card content-card p-3">
      <h6 class="mb-3">Change Password</h6>
      <form id="passwordForm">
        <div class="mb-3"><label class="form-label">Current Password</label><input type="password" id="currentPassword" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">New Password</label><input type="password" id="newPassword" class="form-control" required minlength="8"></div>
        <div class="mb-3"><label class="form-label">Confirm New Password</label><input type="password" id="confirmPassword" class="form-control" required></div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card content-card p-3">
      <h6 class="mb-3">Two-Factor Authentication</h6>
      <div id="totpStatus"></div>
      <div id="totpSetup" style="display:none">
        <p class="text-muted">Scan this URI with your authenticator app:</p>
        <div class="token-display mb-3" id="totpURI"></div>
        <div class="mb-3"><label class="form-label">Your Password</label><input type="password" id="totpPassword" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Verification Code</label><input type="text" id="totpCode" class="form-control" maxlength="6" placeholder="000000"></div>
        <button class="btn btn-success" id="btnEnableTOTP">Enable 2FA</button>
      </div>
    </div>
  </div>
</div>
