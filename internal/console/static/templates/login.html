<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>OXI Metric — Login</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-container" style="flex-direction:column">
  <div class="card login-card">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="login-logo">OXI Metric</div>
        <p class="text-muted mt-1">On-premises analytics</p>
        <p style="font-size:0.8rem;color:#9899ac;font-style:italic;margin-top:0.75rem">Your data. Your servers. Your rules.</p>
      </div>

      <div id="loginAlert" class="alert alert-danger d-hidden"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username or Email</label>
          <input type="text" id="loginInput" class="form-control form-control-lg" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="passwordInput" class="form-control form-control-lg" required>
        </div>
        <div id="totpGroup" class="mb-3 d-hidden">
          <label class="form-label">2FA Code</label>
          <input type="text" id="totpInput" class="form-control form-control-lg" maxlength="6" placeholder="000000" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-lg w-100">Sign In</button>
      </form>
    </div>
  </div>
  <div style="margin-top:1.5rem;text-align:center;font-size:0.8rem">
    <span style="color:rgba(255,255,255,0.5)">&copy; 2022-<span id="copyrightYear"></span></span>
    <a href="https://oxisoft.io" style="color:rgba(255,255,255,0.7);text-decoration:none;margin-left:0.3rem">OxiSoft</a>
    <span style="color:rgba(255,255,255,0.3);margin:0 0.5rem">|</span>
    <a href="https://oxisoft.io" style="color:rgba(255,255,255,0.5);text-decoration:none">oxisoft.io</a>
    <span style="color:rgba(255,255,255,0.3);margin:0 0.5rem">|</span>
    <a href="https://github.com/oxisoft/oximetric" style="color:rgba(255,255,255,0.5);text-decoration:none">GitHub</a>
  </div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
