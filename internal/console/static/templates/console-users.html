<div class="row g-3 mb-4">
  <div class="col-12 d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Console Users</h5>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createUserModal">New User</button>
  </div>
</div>

<div class="card content-card p-3">
  <table class="table table-clean table-sm">
    <thead><tr><th>Username</th><th>Email</th><th>Role</th><th>2FA</th><th>Created</th><th></th></tr></thead>
    <tbody id="usersTable"></tbody>
  </table>
</div>

<!-- Create User Modal -->
<div class="modal fade" id="createUserModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">New User</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Username</label><input type="text" id="newUsername" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email (optional)</label><input type="email" id="newEmail" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" id="newPassword" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Role</label>
        <select id="newRole" class="form-select">
          <option value="viewer">Viewer</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary">Create</button></div>
  </div></div>
</div>
