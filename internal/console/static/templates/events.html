<div class="row g-3 mb-4">
  <div class="col-md-5">
    <div class="card content-card p-3">
      <h6 class="mb-3">Events</h6>
      <table class="table table-clean table-sm table-hover">
        <thead><tr><th>Event Name</th><th class="text-end">Count</th></tr></thead>
        <tbody id="eventsTable"></tbody>
      </table>
    </div>
  </div>
  <div class="col-md-7">
    <div class="card content-card p-3">
      <h6 class="mb-3">Event Time Series</h6>
      <div style="position:relative;height:250px"><canvas id="eventsTimeChart"></canvas></div>
    </div>
    <div class="card content-card p-3 mt-3" id="propsCard" style="display:none">
      <h6 class="mb-3">Properties: <span id="propsEventName"></span></h6>
      <div id="propsContent"></div>
    </div>
  </div>
</div>
