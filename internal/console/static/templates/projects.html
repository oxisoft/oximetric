<div class="row g-3 mb-4">
  <div class="col-12 d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Projects</h5>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createProjectModal">New Project</button>
  </div>
</div>

<div class="card content-card p-3 mb-4">
  <table class="table table-clean table-sm table-hover">
    <thead><tr><th>Name</th><th>Retention</th><th>Created</th><th></th></tr></thead>
    <tbody id="projectsTable"></tbody>
  </table>
</div>

<div id="tokensSection" style="display:none">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Tokens — <span id="tokenProjectName"></span></h5>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createTokenModal">New Token</button>
  </div>
  <div class="card content-card p-3">
    <table class="table table-clean table-sm">
      <thead><tr><th>Label</th><th>Token</th><th>Status</th><th>Created</th><th></th></tr></thead>
      <tbody id="tokensTable"></tbody>
    </table>
  </div>
</div>

<!-- Create Project Modal -->
<div class="modal fade" id="createProjectModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">New Project</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Name</label><input type="text" id="newProjectName" class="form-control"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary">Create</button></div>
  </div></div>
</div>

<!-- Create Token Modal -->
<div class="modal fade" id="createTokenModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">New Token</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Label</label><input type="text" id="newTokenLabel" class="form-control" placeholder="e.g. v1.0, iOS prod"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary">Create</button></div>
  </div></div>
</div>

<!-- Token Created Modal -->
<div class="modal fade" id="tokenCreatedModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Token Created</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <p class="text-muted">Copy this token now. It won't be shown again in full.</p>
      <div class="token-display" id="newTokenValue"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary">Copy</button></div>
  </div></div>
</div>
